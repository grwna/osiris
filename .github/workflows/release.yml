name: Release image

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/grwna/osiris
  IMAGE_TAG: 0.1.0

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - id: image
        name: Build and push linux/amd64 image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --iidfile digest.txt -t "$IMAGE:$IMAGE_TAG" .
          docker push "$IMAGE:$IMAGE_TAG" | tee push.log
          digest="$(awk '/digest: sha256:/{print $2; exit}' push.log)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$IMAGE_TAG@$digest"
